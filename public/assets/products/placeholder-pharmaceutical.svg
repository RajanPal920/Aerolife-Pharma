<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#ED1C24" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4,6" opacity="0.25">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="0" y1="50" x2="600" y2="500" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="0" y1="450" x2="600" y2="450" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="600" height="6" fill="url(#borderGrad)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="598" height="498" rx="15" fill="none" stroke="#CBD5E1" stroke-width="2" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#00AEEF" stroke-width="2" opacity="0.7">
    <path d="M 24 36 L 24 24 L 36 24" fill="none" />
    <path d="M 576 36 L 576 24 L 564 24" fill="none" stroke="#ED1C24" />
    <path d="M 24 464 L 24 476 L 36 476" fill="none" stroke="#ED1C24" />
    <path d="M 576 464 L 576 476 L 564 476" fill="none" />
  </g>

  <!-- Central Pharmaceutical Emblem Card -->
  <g transform="translate(300, 210)">
    <!-- Shadowed Base -->
    <circle cx="0" cy="0" r="76" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="0" cy="0" r="66" fill="#F8FAFC" />

    <!-- Pharmaceutical Capsule & Monograph Shield Icon -->
    <!-- Pill/Capsule -->
    <g transform="rotate(-35)">
      <!-- Left Half of Capsule (Cyan) -->
      <path d="M -36 -18 A 18 18 0 0 1 -36 18 L 0 18 L 0 -18 Z" fill="#00AEEF" />
      <!-- Right Half of Capsule (White / Light Slate) -->
      <path d="M 0 -18 L 36 -18 A 18 18 0 0 1 36 18 L 0 18 Z" fill="#FFFFFF" stroke="#00AEEF" stroke-width="1.5" />
      <!-- Center Seam Line -->
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#102D4B" stroke-width="2" />
      <!-- Shine on left -->
      <path d="M -30 -10 A 10 10 0 0 1 -10 -10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Secondary Accent: Molecular / Quality Dots -->
    <circle cx="-52" cy="-40" r="5" fill="#00AEEF" opacity="0.8" />
    <line x1="-52" y1="-40" x2="-40" y2="-28" stroke="#00AEEF" stroke-width="1.5" opacity="0.5" />
    <circle cx="54" cy="38" r="5" fill="#ED1C24" opacity="0.8" />
    <line x1="54" y1="38" x2="42" y2="26" stroke="#ED1C24" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Brand Typography -->
  <text x="300" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#102D4B" letter-spacing="1.5">
    AERO LIFE PHARMA
  </text>
  
  <text x="300" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="0.5">
    Packaging Image Verification Pending
  </text>

  <!-- Status Pill Badge -->
  <g transform="translate(300, 395)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#00AEEF" fill-opacity="0.1" stroke="#00AEEF" stroke-width="1" />
    <circle cx="-120" cy="0" r="3.5" fill="#00AEEF" />
    <text x="5" y="4.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#0284C7" letter-spacing="0.8">
      CATALOGUE MONOGRAPH VERIFIED
    </text>
  </g>

  <!-- Footnote -->
  <text x="300" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#94A3B8">
    Commercial pack packaging under scheduled photo-documentation
  </text>
</svg>
